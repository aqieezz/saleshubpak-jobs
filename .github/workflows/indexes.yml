name: Ensure indexes

# Creates any missing Postgres indexes WITHOUT running a full 30-minute scrape.
#
# Why this exists: the indexes only reach production from a machine holding the
# production credentials, and until now that was solely the scrape job. That
# made adding an index a 30-minute round trip, and a failure inside it was
# invisible behind the scrape log. It also runs against DIRECT_URL rather than
# the pooled connection, because DDL through a transaction-mode pooler is
# unreliable.
#
# Required secrets: PRIVATE_REPO_TOKEN, DIRECT_URL

on:
  workflow_dispatch: {}

concurrency:
  group: ensure-indexes
  cancel-in-progress: false

jobs:
  indexes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out the private app repo
        uses: actions/checkout@v4
        with:
          repository: aqieezz/saleshubpak
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      - name: Create missing indexes
        # DIRECT_URL for BOTH: DDL wants a direct 5432 session, not the
        # transaction-mode pooler.
        run: npm run db:search-index
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # Verify from a GitHub IP: the developer's own IP is intermittently held
      # by Vercel's abuse checkpoint, so a local curl cannot confirm anything.
      - name: Check the live drops feed
        if: always()
        working-directory: .
        run: |
          echo "--- /api/products/drops ---"
          curl -s --max-time 90 "https://saleshubpak.vercel.app/api/products/drops?days=14" \
            | head -c 1200
          echo ""
          echo "--- /api/health ---"
          curl -s -o /dev/null -w "%{http_code} %{time_total}s\n" --max-time 60 \
            "https://saleshubpak.vercel.app/api/health"
