name: Check API

# Read-only smoke check from a GitHub IP. No `-e` abort: every probe must run
# even when an earlier one times out, or one slow endpoint hides the rest.

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Probe endpoints
        shell: bash
        run: |
          set +e
          B=https://saleshubpak.vercel.app
          for p in /api/health /api/stats /api/home /api/brands "/api/products/drops?days=14" /support /robots.txt; do
            printf '%-34s -> ' "$p"
            curl -s -o /tmp/body -w "%{http_code} %{time_total}s\n" --max-time 45 "$B$p"
          done
          echo ""
          echo "--- drops body ---"
          curl -s --max-time 45 "$B/api/products/drops?days=14" | head -c 600
          echo ""
          echo "--- live deploy ---"
          curl -s --max-time 30 "$B/robots.txt" | head -1
          exit 0
