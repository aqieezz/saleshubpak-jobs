name: Scrape brands

# Runs the Sales Hub PK brand scrape. Lives in this PUBLIC repo because public
# repositories get unlimited GitHub Actions minutes; the application code stays
# in the private repo and is checked out read-only at run time.
#
# Required repository secrets:
#   PRIVATE_REPO_TOKEN  fine-grained PAT, read-only Contents, scoped to the
#                       private app repo only
#   DATABASE_URL        Supabase pooled connection string
#   DIRECT_URL          Supabase direct connection string
# Optional:
#   SCRAPE_PROXY_PREFIX geo-proxy prefix so Khaadi (which redirects US
#                       datacenter IPs away) can be scraped via the API's
#                       Mumbai region. Value:
#                       https://saleshubpk.vercel.app/api/fetch?secret=<CRON_SECRET>&url=
#
# NOTE: this repo is public, which means these workflow LOGS are public.
# GitHub automatically masks registered secret values in logs, which is why
# the connection strings must be stored as secrets and never echoed.

on:
  schedule:
    - cron: "0 */12 * * *" # twice a day; was every 8h, which cost ~1800 min/month
  workflow_dispatch: {}

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out the private app repo
        uses: actions/checkout@v4
        with:
          repository: aqieezz/saleshubpak
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          # do not leave the token behind in .git/config on the runner
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      # Chromium is only needed for the two headless-scraped brands (Bareeze,
      # Uniworth). Caching the browser binary saves a few minutes per run.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Scrape
        run: npm run scrape
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SCRAPE_PROXY_PREFIX: ${{ secrets.SCRAPE_PROXY_PREFIX }}
