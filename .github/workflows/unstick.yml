name: DB unstick

# Maintenance for the production database.
#   vacuum : VACUUM ANALYZE the big tables. The scraper rewrites ~137k rows per
#            run, which leaves the visibility map stale and turns index-only
#            scans into per-row heap fetches. This is the usual fix when the
#            aggregate endpoints go slow while small ones stay fast.
#   kill   : terminate orphaned/stuck backends. Report-only unless set.
on:
  workflow_dispatch:
    inputs:
      vacuum:
        description: "VACUUM ANALYZE the big tables"
        type: boolean
        default: false
      kill:
        description: "Terminate stuck/orphaned backends"
        type: boolean
        default: false

jobs:
  unstick:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aqieezz/saleshubpak
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Maintenance
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DO_VACUUM: ${{ inputs.vacuum }}
          DO_KILL: ${{ inputs.kill }}
        run: |
          ARGS=""
          if [ "$DO_VACUUM" = "true" ]; then ARGS="$ARGS --vacuum"; fi
          if [ "$DO_KILL" = "true" ]; then ARGS="$ARGS --kill"; fi
          echo "running with:$ARGS"
          npx tsx src/scripts/db-unstick.ts $ARGS
