name: DB unstick

# Maintenance for the production database.
#   vacuum : VACUUM ANALYZE the big tables. The scraper rewrites ~137k rows per
#            run, which leaves the visibility map stale and turns index-only
#            scans into per-row heap fetches. This is the usual fix when the
#            aggregate endpoints go slow while small ones stay fast.
#   full   : VACUUM FULL "Product". Rewrites the table compactly and returns
#            the free space, which plain VACUUM never does. LOCKS Product for
#            its whole duration (every product query waits), so quiet hours
#            only, between scrapes. Added for the 2026-10-16 size crisis
#            (482 of 500 MB on the free plan).
#   kill   : terminate orphaned/stuck backends. Report-only unless set.
on:
  workflow_dispatch:
    inputs:
      vacuum:
        description: "VACUUM ANALYZE the big tables"
        type: boolean
        default: false
      full:
        description: "VACUUM FULL Product (locks it; quiet hours only)"
        type: boolean
        default: false
      kill:
        description: "Terminate stuck/orphaned backends"
        type: boolean
        default: false
      start_at:
        description: "Wait until this UTC time (HH:MM, e.g. 22:00) before starting"
        type: string
        default: ""

jobs:
  unstick:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aqieezz/saleshubpak
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Wait for the maintenance window
        if: ${{ inputs.start_at != '' }}
        working-directory: .
        env:
          START_AT: ${{ inputs.start_at }}
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date -u +%s)
          target=$(date -u -d "today $START_AT" +%s)
          if [ "$target" -le "$now" ]; then echo "$START_AT UTC has passed; starting now"; target=$now; fi
          echo "waiting $(( (target - now) / 60 )) min until $START_AT UTC"
          sleep $(( target - now ))
          # Never overlap a scrape: VACUUM FULL locks Product for its duration.
          for i in $(seq 1 60); do
            busy=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Scrape brands" --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length')
            if [ "$busy" = "0" ]; then break; fi
            echo "a scrape is running; waiting 2 min"; sleep 120
          done
      - name: Maintenance
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DO_VACUUM: ${{ inputs.vacuum }}
          DO_FULL: ${{ inputs.full }}
          DO_KILL: ${{ inputs.kill }}
        run: |
          ARGS=""
          if [ "$DO_VACUUM" = "true" ]; then ARGS="$ARGS --vacuum"; fi
          if [ "$DO_FULL" = "true" ]; then ARGS="$ARGS --full"; fi
          if [ "$DO_KILL" = "true" ]; then ARGS="$ARGS --kill"; fi
          echo "running with:$ARGS"
          npx tsx src/scripts/db-unstick.ts $ARGS
