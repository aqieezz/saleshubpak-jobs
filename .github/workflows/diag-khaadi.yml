name: Diag Khaadi
on: { workflow_dispatch: {} }
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Trace Khaadi redirect from datacenter IP
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          U="https://pk.khaadi.com/on/demandware.store/Sites-Khaadi_PK-Site/en_PK/Search-UpdateGrid?cgid=008-Sale&start=0&sz=24"
          echo "== response headers (no follow) =="
          curl -sS -m 40 -A "$UA" -D - -o /dev/null "$U" 2>&1 | grep -iE "^HTTP|^location|^set-cookie|^server|^cf-|^x-" | head -20
          echo ""
          echo "== homepage from datacenter =="
          curl -sS -m 40 -A "$UA" -D - -o hp.html "https://pk.khaadi.com/" -w "\nhttp=%{http_code} size=%{size_download} final=%{url_effective}\n" 2>&1 | grep -iE "^HTTP|^location|http=|final=" | head -10
          echo "homepage data-pid count: $(grep -o 'data-pid=' hp.html | wc -l)"
          echo ""
          echo "== follow redirects, where do we land =="
          curl -sSL -m 40 -A "$UA" -o /dev/null -w "final=%{url_effective} http=%{http_code} size=%{size_download}\n" "$U" 2>&1 | tail -3
