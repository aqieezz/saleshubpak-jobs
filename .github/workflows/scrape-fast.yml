name: Scrape fast-selling brands

# Re-reads, every hour, the brands that take a product off their site the
# moment it sells out. Its page then answers 404 and the shop sends our
# visitor to its homepage, so between the full scrapes (scrape.yml, every
# 12 hours) those "Shop at" links are dead. Measured 2026-11-07, 2h20m after
# a full run: 41 Limelight, 3 Alkaram and 3 Outfitters links we listed as
# live were dead. Brands that keep sold-out items on their site (Gul Ahmed,
# Breakout, Cougar...) do not need this.
#
# Same code, secrets and rules as scrape.yml (coverage guard, hide-then-delete,
# price records, notifications), for these brands only. It skips itself while
# the full scrape is queued or running: that run covers these brands too, and
# two runs writing the same brand at once is what this avoids. It has its own
# concurrency group, because sharing scrape.yml's would let a queued hourly
# run cancel a full scrape that is waiting its turn.
#
# Who starts it: GitHub's own schedule fired only ~10 of ~65 hourly slots from
# 2026-11-07 to 2026-11-10. So since 2026-11-10 the database server (Contabo,
# Mumbai) starts it every hour at :30 through workflow_dispatch: see
# /usr/local/sbin/saleshub-dispatch-fast and /etc/cron.d/saleshub-dispatch-fast
# there. Its token is a fine-grained GitHub token for this repo only, with
# Actions read and write. The schedule below stays as a fallback, in case that
# token expires. A scheduled run skips itself when a dispatched run started in
# the last 50 minutes. Dispatched runs never skip for that reason, so the two
# cannot cancel each other out.

on:
  schedule:
    - cron: "30 * * * *" # hourly, half past: clear of the full scrape's slot
  workflow_dispatch: {}

concurrency:
  group: scrape-fast
  cancel-in-progress: false

permissions:
  actions: read # to see whether the full scrape is running, and recent dispatched runs
  contents: read

env:
  BRANDS: limelight,alkaram,outfitters

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server

    steps:
      - name: Skip while the full scrape is queued or running, or the server already started this hour's run
        id: gate
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=false
          busy=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow scrape.yml --limit 5 \
            --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$busy" != "0" ]; then
            skip=true
            echo "The full scrape is queued or running; it covers $BRANDS. Skipping."
          fi
          if [ "$skip" = false ] && [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            since=$(date -u -d '50 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
            recent=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow scrape-fast.yml --event workflow_dispatch \
              --limit 5 --json createdAt --jq "[.[] | select(.createdAt > \"$since\")] | length")
            if [ "$recent" != "0" ]; then
              skip=true
              echo "A dispatched run (the database server's hourly trigger) started after $since. Skipping."
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Check out the private app repo
        if: steps.gate.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          repository: aqieezz/saleshubpak
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          # do not leave the token behind in .git/config on the runner
          persist-credentials: false

      - if: steps.gate.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - if: steps.gate.outputs.skip == 'false'
        run: npm ci

      - if: steps.gate.outputs.skip == 'false'
        run: npx prisma generate

      - name: Scrape ${{ env.BRANDS }}
        if: steps.gate.outputs.skip == 'false'
        run: npm run scrape:one -- "$BRANDS"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          # The site's canonical address: the scrape pings IndexNow for these URLs.
          PUBLIC_SITE_URL: https://saleshubpk.com
